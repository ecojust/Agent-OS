name: Android checks
# A fixed diagnostic label remains identifiable even when no emulator artifact exists.
# Empty preserves GitHub's existing push/PR/full-dispatch display title.
run-name: ${{ github.event_name == 'workflow_dispatch' && (inputs.scope == 'owned-control-diagnostic' && 'Android checks [owned-control-diagnostic]' || inputs.scope == 'task-qualification-diagnostic' && 'Android checks [task-qualification-diagnostic]' || inputs.scope == 'control-status-diagnostic' && 'Android checks [control-status-diagnostic]' || inputs.scope == 'screen-off-diagnostic' && 'Android checks [screen-off-diagnostic]' || inputs.scope == 'task-report-focus-diagnostic' && 'Android checks [task-report-focus-diagnostic]' || inputs.scope == 'font-scale-diagnostic' && 'Android checks [font-scale-diagnostic]' || inputs.scope == 'visual-generation-diagnostic' && 'Android checks [visual-generation-diagnostic]' || inputs.scope == 'activity-font-scale-diagnostic' && 'Android checks [activity-font-scale-diagnostic]' || inputs.scope == 'rotation-diagnostic' && 'Android checks [rotation-diagnostic]' || inputs.scope == 'numeric-import-diagnostic' && 'Android checks [numeric-import-diagnostic]' || inputs.scope == 'navigation-origin-diagnostic' && 'Android checks [navigation-origin-diagnostic]' || inputs.scope == 'navigation-origin-rebuild-diagnostic' && 'Android checks [navigation-origin-rebuild-diagnostic]' || inputs.scope == 'idle-pair-diagnostic' && 'Android checks [idle-pair-diagnostic]' || inputs.scope == 'stress-diagnostic' && 'Android checks [stress-diagnostic]' || inputs.scope == 'active-pair-diagnostic' && 'Android checks [active-pair-diagnostic]' || inputs.scope == 'app-experience-pilot' && 'Android checks [app-experience-pilot]' || inputs.scope == 'app-experience-diagnostic' && 'Android checks [app-experience-diagnostic]') || '' }}

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Full regression or one fixed diagnostic (not full acceptance)
        required: true
        default: full
        type: choice
        options: [full, owned-control-diagnostic, task-qualification-diagnostic, control-status-diagnostic, screen-off-diagnostic, task-report-focus-diagnostic, font-scale-diagnostic, visual-generation-diagnostic, activity-font-scale-diagnostic, rotation-diagnostic, numeric-import-diagnostic, navigation-origin-diagnostic, navigation-origin-rebuild-diagnostic, idle-pair-diagnostic, stress-diagnostic, active-pair-diagnostic, app-experience-pilot, app-experience-diagnostic]

permissions:
  contents: read

concurrency:
  # Explicit manual verification must not cancel an older run before evidence collection.
  group: ${{ github.event_name == 'workflow_dispatch' && format('android-manual-{0}', github.run_id) || format('android-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            app
            core
            fixture
            compat-smoke
            upgrade-smoke
            docs
            gradle
            scripts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify README progress
        run: python3 scripts/update_progress.py --check
      - name: Prepare preinstalled Android SDK
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdk_manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdk_manager"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          "$sdk_manager" --version
          printf 'y\n%.0s' {1..100} | "$sdk_manager" --sdk_root="$sdk_root" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test evidence collection boundaries
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test, inspect and build
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            core/build/reports/
            core/build/test-results/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: agent-os-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  emulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && (inputs.scope == 'stress-diagnostic' || inputs.scope == 'app-experience-diagnostic') && 55 || 35 }}
    env:
      ANDROID_TEST_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'full' }}
    strategy:
      fail-fast: false
      # Each API has an isolated runner; keep the same matrix and test count
      # while avoiding three sequential emulator batches during regression work.
      max-parallel: 8
      matrix:
        api-level: ['30', '31', '32', '33', '34', '35', '36', '37.0']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            app
            core
            fixture
            compat-smoke
            upgrade-smoke
            docs
            gradle
            scripts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare preinstalled Android SDK
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdk_manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdk_manager"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          "$sdk_manager" --version
          printf 'y\n%.0s' {1..100} | "$sdk_manager" --sdk_root="$sdk_root" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Enable full API version SDK tooling
        if: matrix.api-level == '37.0'
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          printf 'y\n%.0s' {1..100} | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" 'cmdline-tools;23.0'
          test -x "$sdk_root/cmdline-tools/23.0/bin/sdkmanager"
          mv "$sdk_root/cmdline-tools/latest" "$sdk_root/cmdline-tools/pre-api37"
          ln -s 23.0 "$sdk_root/cmdline-tools/latest"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Fetch the pinned startup trace processor
        if: startsWith(env.ANDROID_TEST_SCOPE, 'app-experience-')
        run: |
          echo "AGENT_OS_TRACE_PROCESSOR_CACHE=$RUNNER_TEMP/agent-os-perfetto-v59.1" >> "$GITHUB_ENV"
          python3 scripts/experience_trace.py download --cache "$RUNNER_TEMP/agent-os-perfetto-v59.1"
      - name: Exercise Android execution boundaries
        id: instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '35'
          system-image-api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          avd-name: agent-os-phone
          enable-hw-keyboard: false
          pre-emulator-launch-script: python3 scripts/configure_emulator_phone.py --avd-name agent-os-phone
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            python3 scripts/configure_emulator_phone.py --avd-name agent-os-phone --check
            bash scripts/run_android_tests.sh ${{ matrix.api-level }} "$ANDROID_TEST_SCOPE"
      - name: Finalize screenshot evidence
        if: always()
        continue-on-error: true
        env:
          EMULATOR_OUTCOME: ${{ steps.instrumentation.outcome }}
        run: python3 scripts/collect_android_evidence.py finalize --matrix-label ${{ matrix.api-level }} --scope "$ANDROID_TEST_SCOPE" --step-outcome "$EMULATOR_OUTCOME"
      - name: Print Android failure details
        if: always()
        continue-on-error: true
        run: python3 scripts/print_android_test_failures.py
      - name: Finalize performance diagnostics
        if: always()
        continue-on-error: true
        env:
          EMULATOR_OUTCOME: ${{ steps.instrumentation.outcome }}
        run: python3 scripts/collect_performance_evidence.py finalize --matrix-label ${{ matrix.api-level }} --step-outcome "${EMULATOR_OUTCOME:-unknown}"
      - name: Finalize alternating idle diagnostics
        if: always() && env.ANDROID_TEST_SCOPE == 'idle-pair-diagnostic'
        continue-on-error: true
        env:
          EMULATOR_OUTCOME: ${{ steps.instrumentation.outcome }}
        run: python3 scripts/collect_idle_pair_evidence.py finalize --matrix-label ${{ matrix.api-level }} --step-outcome "${EMULATOR_OUTCOME:-unknown}"
      - name: Finalize segmented stress diagnostics
        if: always() && env.ANDROID_TEST_SCOPE == 'stress-diagnostic'
        continue-on-error: true
        env:
          EMULATOR_OUTCOME: ${{ steps.instrumentation.outcome }}
        run: python3 scripts/collect_stress_evidence.py finalize --matrix-label ${{ matrix.api-level }} --step-outcome "${EMULATOR_OUTCOME:-unknown}"
      - name: Finalize active task pair diagnostics
        if: always() && env.ANDROID_TEST_SCOPE == 'active-pair-diagnostic'
        continue-on-error: true
        env:
          EMULATOR_OUTCOME: ${{ steps.instrumentation.outcome }}
        run: python3 scripts/collect_active_pair_evidence.py finalize --matrix-label ${{ matrix.api-level }} --step-outcome "${EMULATOR_OUTCOME:-unknown}"
      - name: Finalize target app experience diagnostics
        if: always() && startsWith(env.ANDROID_TEST_SCOPE, 'app-experience-')
        continue-on-error: true
        env:
          EMULATOR_OUTCOME: ${{ steps.instrumentation.outcome }}
        run: python3 scripts/collect_app_experience_evidence.py finalize --matrix-label ${{ matrix.api-level }} --scope "$ANDROID_TEST_SCOPE" --step-outcome "${EMULATOR_OUTCOME:-unknown}"
      - name: Upload emulator test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload instrumentation execution diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-diagnostics-api-${{ matrix.api-level }}-attempt-${{ github.run_attempt }}
          path: instrumentation-diagnostics/api-${{ matrix.api-level }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-api-${{ matrix.api-level }}-attempt-${{ github.run_attempt }}
          path: test-evidence/api-${{ matrix.api-level }}/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload performance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports-api-${{ matrix.api-level }}-attempt-${{ github.run_attempt }}
          path: performance-evidence/api-${{ matrix.api-level }}/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload alternating idle diagnostics
        if: always() && env.ANDROID_TEST_SCOPE == 'idle-pair-diagnostic'
        uses: actions/upload-artifact@v4
        with:
          name: idle-pair-reports-api-${{ matrix.api-level }}-attempt-${{ github.run_attempt }}
          path: idle-pair-evidence/api-${{ matrix.api-level }}/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload segmented stress diagnostics
        if: always() && env.ANDROID_TEST_SCOPE == 'stress-diagnostic'
        uses: actions/upload-artifact@v4
        with:
          name: stress-reports-api-${{ matrix.api-level }}-attempt-${{ github.run_attempt }}
          path: stress-evidence/api-${{ matrix.api-level }}/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload active task pair diagnostics
        if: always() && env.ANDROID_TEST_SCOPE == 'active-pair-diagnostic'
        uses: actions/upload-artifact@v4
        with:
          name: active-pair-reports-api-${{ matrix.api-level }}-attempt-${{ github.run_attempt }}
          path: active-pair-evidence/api-${{ matrix.api-level }}/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload target app experience diagnostics
        if: always() && startsWith(env.ANDROID_TEST_SCOPE, 'app-experience-')
        uses: actions/upload-artifact@v4
        with:
          name: app-experience-reports-api-${{ matrix.api-level }}-attempt-${{ github.run_attempt }}
          path: app-experience-evidence/api-${{ matrix.api-level }}/
          if-no-files-found: warn
          retention-days: 30
