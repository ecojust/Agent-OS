name: Record a busy-stop walkthrough

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: busy-stop-video-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  record-busy-stop:
    name: record-busy-stop (API 35)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize the separate one-case walkthrough
        run: python3 scripts/busy_stop_video.py prepare --output "$RUNNER_TEMP/busy-stop-probe"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify recorder and source boundaries
        run: |
          python3 -m unittest discover -s scripts -p 'test_busy_stop_video.py'
          python3 -m unittest discover -s scripts -p 'test_probe_video*.py'
      - name: Prepare optional recording tools
        continue-on-error: true
        run: bash scripts/ensure_demo_video_tools.sh
      - name: Prepare Android SDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          printf 'y\n%.0s' {1..100} | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build the unchanged-permission app and fixed walkthrough
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :fixture:assembleDebug
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record one actual in-flight platform call and overlay stop
        id: walkthrough
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '35'
          arch: x86_64
          target: default
          avd-name: agent-os-busy-stop-video
          enable-hw-keyboard: false
          pre-emulator-launch-script: python3 scripts/configure_emulator_phone.py --avd-name agent-os-busy-stop-video
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            python3 scripts/configure_emulator_phone.py --avd-name agent-os-busy-stop-video --check
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb install -t fixture/build/outputs/apk/debug/fixture-debug.apk
            python3 scripts/busy_stop_video.py record --output "$RUNNER_TEMP/busy-stop-probe" --video-output "$RUNNER_TEMP/busy-stop-video"
      - name: Preserve failures without repeating the walkthrough
        if: always()
        run: python3 scripts/busy_stop_video.py finalize --output "$RUNNER_TEMP/busy-stop-probe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: busy-stop-walkthrough-api-35-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/busy-stop-probe/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-video-busy-stop-platform-api-35-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/busy-stop-video/
          if-no-files-found: warn
          retention-days: 30
