name: Pinned Calculator page predicate
run-name: ${{ inputs.record_video && 'Pinned Calculator page predicate [API35 video]' || '' }}

on:
  workflow_dispatch:
    inputs:
      record_video:
        description: Record all five unchanged page cases on API35 only (not the four-API matrix)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pinned-calculator-page-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify the fixed evidence profile
        run: |
          python3 scripts/update_progress.py --check
          python3 -m unittest discover -s scripts -p 'test_pinned*.py'
          python3 -m unittest discover -s scripts -p 'test_evidence_scripts.py'
          python3 -m unittest discover -s scripts -p 'test_probe_video*.py'
      - name: Prepare Android SDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          printf 'y\n%.0s' {1..100} | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build unchanged-permission application and test APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :fixture:assembleDebug :fixture:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-page-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            fixture/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  page-predicate:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        api: ${{ fromJSON(inputs.record_video && '["35"]' || '["34","35","36","37.0"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Initialize all five required outcomes as unverified
        run: python3 scripts/pinned_calculator_page.py prepare --api '${{ matrix.api }}' --output "$RUNNER_TEMP/pinned-page-evidence/api-${{ matrix.api }}"
      - uses: actions/download-artifact@v4
        with:
          name: pinned-page-apks
          path: ${{ runner.temp }}/pinned-page-apks
      - name: Fetch the exact official Calculator release
        run: python3 scripts/third_party_smoke_set.py download --app-id calculator-1.4.0 --output "$RUNNER_TEMP/calculator-1.4.0.apk"
      - name: Prepare Android SDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          printf 'y\n%.0s' {1..100} | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Enable full API version SDK tooling
        if: matrix.api == '37.0'
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          printf 'y\n%.0s' {1..100} | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" 'cmdline-tools;23.0'
          test -x "$sdk_root/cmdline-tools/23.0/bin/sdkmanager"
          mv "$sdk_root/cmdline-tools/latest" "$sdk_root/cmdline-tools/pre-api37"
          ln -s 23.0 "$sdk_root/cmdline-tools/latest"
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare continuous recording tools
        if: inputs.record_video
        continue-on-error: true
        run: bash scripts/ensure_demo_video_tools.sh
      - name: Evaluate actual pinned pages with the default production service
        id: instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '35'
          system-image-api-level: ${{ matrix.api }}
          emulator-build: '16428233'
          arch: x86_64
          target: default
          avd-name: agent-os-pinned-page
          enable-hw-keyboard: false
          pre-emulator-launch-script: python3 scripts/configure_emulator_phone.py --avd-name agent-os-pinned-page
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            python3 scripts/configure_emulator_phone.py --avd-name agent-os-pinned-page --check
            python3 scripts/pinned_calculator_page.py run --api '${{ matrix.api }}' --output "$RUNNER_TEMP/pinned-page-evidence/api-${{ matrix.api }}" --sdk-root "$ANDROID_HOME" --calculator-apk "$RUNNER_TEMP/calculator-1.4.0.apk" --agent-apk "$RUNNER_TEMP/pinned-page-apks/app/build/outputs/apk/debug/app-debug.apk" --fixture-apk "$RUNNER_TEMP/pinned-page-apks/fixture/build/outputs/apk/debug/fixture-debug.apk" --test-apk "$RUNNER_TEMP/pinned-page-apks/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk" ${{ inputs.record_video && '--video-output "$RUNNER_TEMP/probe-video"' || '' }}
      - name: Preserve failed, blocked and unexecuted evidence
        if: always()
        env:
          EMULATOR_OUTCOME: ${{ steps.instrumentation.outcome }}
        run: python3 scripts/pinned_calculator_page.py finalize --api '${{ matrix.api }}' --output "$RUNNER_TEMP/pinned-page-evidence/api-${{ matrix.api }}" --outcome "${EMULATOR_OUTCOME:-unknown}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-api-${{ matrix.api }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pinned-page-evidence/api-${{ matrix.api }}/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always() && inputs.record_video
        with:
          name: probe-video-pinned-calculator-page-api-35-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/probe-video/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pinned-page-timeout-diagnostics-${{ matrix.api }}-attempt-${{ github.run_attempt }}
          path: instrumentation-diagnostics/api-${{ matrix.api }}/
          if-no-files-found: ignore
          retention-days: 14
