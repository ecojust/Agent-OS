name: Third-party app smoke

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run the pinned emulator probes or archive a completed probe run
        required: true
        default: test
        type: choice
        options: [test, archive]
      run_id:
        description: Completed test run ID; required only for archive
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: third-party-smoke-${{ inputs.mode }}-${{ inputs.run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master' && inputs.mode == 'test'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify evidence boundaries and progress
        run: |
          python3 scripts/update_progress.py --check
          python3 -m unittest discover -s scripts -p 'test_third_party_smoke*.py'
      - name: Prepare Android SDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          printf 'y\n%.0s' {1..100} | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build the executor and isolated probe APKs
        run: ./gradlew --no-daemon :app:assembleDebug :compat-smoke:assembleDebug :compat-smoke:assembleDebugAndroidTest :compat-smoke:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-probe-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            compat-smoke/build/outputs/apk/debug/*.apk
            compat-smoke/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  probe:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        api: ['30', '31', '32', '33', '34', '35', '36', '37.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Initialize a complete unverified result
        run: python3 scripts/third_party_smoke_set.py prepare --api '${{ matrix.api }}' --output "$RUNNER_TEMP/third-party-evidence/api-${{ matrix.api }}"
      - uses: actions/download-artifact@v4
        with:
          name: third-party-probe-apks
          path: ${{ runner.temp }}/third-party-apks
      - name: Fetch the two frozen official releases
        run: |
          python3 scripts/third_party_smoke_set.py download --app-id calculator-1.4.0 --output "$RUNNER_TEMP/calculator-1.4.0.apk"
          python3 scripts/third_party_smoke_set.py download --app-id notes-1.7.0 --output "$RUNNER_TEMP/notes-1.7.0.apk"
      - name: Prepare Android SDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          printf 'y\n%.0s' {1..100} | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Enable full API version SDK tooling
        if: matrix.api == '37.0'
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          printf 'y\n%.0s' {1..100} | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" 'cmdline-tools;23.0'
          test -x "$sdk_root/cmdline-tools/23.0/bin/sdkmanager"
          mv "$sdk_root/cmdline-tools/latest" "$sdk_root/cmdline-tools/pre-api37"
          ln -s 23.0 "$sdk_root/cmdline-tools/latest"
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the unmodified application
        id: instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '35'
          system-image-api-level: ${{ matrix.api }}
          # Official stable SDK repository revision 37.2.12; runtime also verifies >=37.2.11 for API37.
          emulator-build: '16428233'
          arch: x86_64
          target: default
          avd-name: agent-os-third-party
          enable-hw-keyboard: false
          pre-emulator-launch-script: python3 scripts/configure_emulator_phone.py --avd-name agent-os-third-party
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            python3 scripts/configure_emulator_phone.py --avd-name agent-os-third-party --check
            python3 scripts/third_party_smoke_set.py run --api '${{ matrix.api }}' --output "$RUNNER_TEMP/third-party-evidence/api-${{ matrix.api }}" --sdk-root "$ANDROID_HOME" --calculator-apk "$RUNNER_TEMP/calculator-1.4.0.apk" --notes-apk "$RUNNER_TEMP/notes-1.7.0.apk" --agent-apk "$RUNNER_TEMP/third-party-apks/app/build/outputs/apk/debug/app-debug.apk" --probe-apk "$RUNNER_TEMP/third-party-apks/compat-smoke/build/outputs/apk/debug/compat-smoke-debug.apk" --test-apk "$RUNNER_TEMP/third-party-apks/compat-smoke/build/outputs/apk/androidTest/debug/compat-smoke-debug-androidTest.apk"
      - name: Preserve failed and incomplete outcomes
        if: always()
        env:
          EMULATOR_OUTCOME: ${{ steps.instrumentation.outcome }}
        run: python3 scripts/third_party_smoke_set.py finalize --api '${{ matrix.api }}' --output "$RUNNER_TEMP/third-party-evidence/api-${{ matrix.api }}" --outcome "${EMULATOR_OUTCOME:-unknown}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: third-party-smoke-v3-api-${{ matrix.api }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/third-party-evidence/api-${{ matrix.api }}/
          if-no-files-found: error
          retention-days: 30

  archive:
    if: github.ref == 'refs/heads/master' && inputs.mode == 'archive'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify the completed source and matching artifacts
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/third-party-source.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/third-party-artifacts.json"
          python3 scripts/third_party_smoke_archive.py validate-source --source-run-json "$RUNNER_TEMP/third-party-source.json" --artifact-index "$RUNNER_TEMP/third-party-artifacts.json" --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.commit }}
          persist-credentials: false
      - name: Download only the verified current-attempt artifacts
        if: steps.source.outputs.artifactIds != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.runId }}
          artifact-ids: ${{ steps.source.outputs.artifactIds }}
          path: ${{ runner.temp }}/third-party-evidence-input
      - name: Archive the fixed sample and all outcomes
        env:
          EVIDENCE_PATH: ${{ steps.source.outputs.evidencePath }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.runId }}
        run: |
          python3 scripts/third_party_smoke_archive.py archive --source-run-json "$RUNNER_TEMP/third-party-source.json" --artifact-index "$RUNNER_TEMP/third-party-artifacts.json" --incoming "$RUNNER_TEMP/third-party-evidence-input"
          python3 scripts/update_progress.py --evidence-path "$EVIDENCE_PATH" --run-url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --note '归档固定第三方应用的专用模拟器开发探针；保留关闭/空闲两态的通过、失败、受保护与未执行记录，不作为真机、升级或常用应用总体兼容验收。'
          python3 scripts/update_progress.py --check
      - name: Commit evidence on an isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_PATH: ${{ steps.source.outputs.evidencePath }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.runId }}
          SOURCE_ATTEMPT: ${{ steps.source.outputs.attempt }}
        run: |
          branch="evidence/third-party-$SOURCE_RUN_ID-$SOURCE_ATTEMPT"
          gh auth setup-git
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo 'Evidence branch already exists; refusing to overwrite it.'
            exit 1
          fi
          git switch -c "$branch"
          git config user.name agent
          git config user.email 30574854+ecojust@users.noreply.github.com
          git add -- "$EVIDENCE_PATH" README.md docs/progress.json docs/diagrams/development-progress.svg
          git diff --cached --check
          git commit -m "Archive third-party application probe $SOURCE_RUN_ID [skip ci]"
          git push origin "HEAD:refs/heads/$branch"
          echo "Evidence branch: https://github.com/$GITHUB_REPOSITORY/tree/$branch" >> "$GITHUB_STEP_SUMMARY"
