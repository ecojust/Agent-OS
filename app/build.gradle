plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.agentos.app'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'dev.agentos.app'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    def selectedTestType = providers.gradleProperty('agentTestBuildType').getOrElse('debug')
    if (!(selectedTestType in ['debug', 'visualAcceptance'])) {
        throw new GradleException('agentTestBuildType must be debug or visualAcceptance')
    }
    testBuildType selectedTestType
    buildTypes {
        visualAcceptance {
            initWith debug
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
        }
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
        checkTestSources true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation project(':core')
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
